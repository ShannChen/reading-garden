name: Validate NIH RePORTER search
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - nih-reporter.js
      - tests/nih-reporter-test.cjs
      - scripts/check-nih-reporter.py
      - .github/workflows/check-nih-reporter.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test NIH search behavior
        run: node tests/nih-reporter-test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official NIH server API
        run: python scripts/check-nih-reporter.py
