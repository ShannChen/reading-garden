name: Inspect Stanford seminar sources
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-stanford-seminars.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public department calendar structure
        run: |
          python - <<'PY'
          import urllib.request,re
          for url in ['https://chemistry.stanford.edu/events/upcoming-events','https://physics.stanford.edu/news-events/upcoming-events','https://biology.stanford.edu/']:
            try:
              with urllib.request.urlopen(url,timeout=25) as r:s=r.read().decode()
              print('SOURCE',url)
              print('ARTICLES',re.findall(r'<article.*?</article>',s,re.S)[:1])
              print('DATES',re.findall(r'.{0,100}(?:datetime|schema:startDate).{0,250}',s)[:8])
              print('EVENT LINKS',re.findall(r'href="([^"]*(?:upcoming|events)[^"]*)"',s)[-20:])
            except Exception as e:print('ERROR',e)
          PY
