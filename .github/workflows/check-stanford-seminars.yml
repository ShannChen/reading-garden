name: Inspect Stanford seminar sources
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-stanford-seminars.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public Stanford calendar metadata
        run: |
          python - <<'PY'
          import urllib.request,json
          for path in ['events/filters','groups?pp=100','departments?pp=100','events?days=90&pp=3']:
            try:
              with urllib.request.urlopen('https://events.stanford.edu/api/2/'+path,timeout=30) as r:d=json.load(r)
              if path.startswith('groups') or path.startswith('departments'):
                key=path.split('?')[0]
                print(path,json.dumps({'page':d.get('page'),key:[{key[:-1]:{k:v for k,v in x.get(key[:-1],{}).items() if k in ['id','name','url_name','url']}} for x in d.get(key,[])]}))
              else:print(path,json.dumps(d)[:30000])
            except Exception as e:print(path,'ERROR',str(e))
          PY
